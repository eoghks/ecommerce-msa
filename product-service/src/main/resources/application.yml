spring:
  application:
    name: product-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/product_db}
    username: ${DB_USERNAME:eoghks}
    password: ${DB_PASSWORD:eoghks_local}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  data:
    redis:
      host: ${REDIS_PRODUCT_HOST:localhost}
      port: ${REDIS_PRODUCT_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: product-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

kafka:
  topic:
    order-created: order.created
    stock-decreased: stock.decreased
    stock-decrease-failed: stock.decrease.failed

service:
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}

minio:
  endpoint:   ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket:     product-images
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  file:
    name: ${user.dir}/logs/product-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
  level:
    com.ecommerce: INFO
