spring:
  application:
    name: order-service
  jackson:
    # M-3: 통계 집계 기준 타임존(KST) 고정 — JVM 기본 타임존은 OrderServiceApplication 에서 설정한다.
    time-zone: Asia/Seoul
    deserialization:
      # F-01: 정의되지 않은 요청 필드는 400으로 거부 — 오타·잘못된 계약을 조용히 무시하지 않는다.
      # (Redis 전용 매퍼를 빈으로 노출하지 않게 되면서 Boot 기본값(무시)으로 돌아가므로 명시 설정으로 고정)
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/order_db}
    username: ${DB_USERNAME:eoghks}
    password: ${DB_PASSWORD:eoghks_local}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_ORDER_HOST:localhost}
      port: ${REDIS_ORDER_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

kafka:
  topic:
    order-created: order.created
    order-item-cancelled: order.item.cancelled
    stock-decreased: stock.decreased
    stock-decrease-failed: stock.decrease.failed

app:
  order:
    # payment-foundation §3.2: 배송완료 후 자동 구매확정까지의 대기 일수(정책값).
    # 정책 테이블(mileage_policy) 이관은 마일리지 단계(V1.1-9)에서 진행한다.
    auto-confirm-days: ${ORDER_AUTO_CONFIRM_DAYS:7}
    # 자동확정 1회 실행당 처리 상한 — 대량 적체 시 트랜잭션이 길어지지 않게 제한
    auto-confirm-batch-size: ${ORDER_AUTO_CONFIRM_BATCH_SIZE:500}
    # payment-foundation §11.1: 결제 대기(PAYMENT_PENDING) 주문을 만료 처리하기까지의 대기 분(정책값)
    payment-expire-minutes: ${ORDER_PAYMENT_EXPIRE_MINUTES:30}
  internal:
    # M-N1: 서비스 간 내부 호출 공유 시크릿. dev 기본값, prod는 INTERNAL_TOKEN env 필수.
    token: ${INTERNAL_TOKEN:dev-internal-secret}

# V1.1-6: 토스페이먼츠 샌드박스 (payment-foundation §11-1)
# 시크릿키는 반드시 env(TOSS_SECRET_KEY)로 주입한다. 아래 기본값은 토스가 공개한 샌드박스 테스트키이며
# 운영 배포 시 절대 사용하지 않는다. 키는 로그·응답 어디에도 출력하지 않는다(§11.1 키 관리).
# 프론트의 결제위젯 클라이언트 키(VITE_TOSS_CLIENT_KEY=test_gck_docs_...)와 같은
# "결제위젯 연동" 키 쌍이어야 승인이 성립한다 — 연동 유형이 다른 키를 섞으면 승인이 거부된다.
toss:
  api-base-url: ${TOSS_API_BASE_URL:https://api.tosspayments.com}
  secret-key: ${TOSS_SECRET_KEY:test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6}
  # 결제 승인은 카드사 왕복이 있어 read 타임아웃을 넉넉히 잡되 무한 대기는 두지 않는다
  connect-timeout-ms: ${TOSS_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${TOSS_READ_TIMEOUT_MS:10000}

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never    # 보안(H-A): 헬스 상세 비노출. status(UP/DOWN)만 공개 — 모니터링은 status만 사용

logging:
  file:
    name: ${user.dir}/logs/order-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
  level:
    com.ecommerce: INFO
