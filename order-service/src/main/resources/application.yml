spring:
  application:
    name: order-service
  jackson:
    # M-3: 통계 집계 기준 타임존(KST) 고정 — JVM 기본 타임존은 OrderServiceApplication 에서 설정한다.
    time-zone: Asia/Seoul
    deserialization:
      # F-01: 정의되지 않은 요청 필드는 400으로 거부 — 오타·잘못된 계약을 조용히 무시하지 않는다.
      # (Redis 전용 매퍼를 빈으로 노출하지 않게 되면서 Boot 기본값(무시)으로 돌아가므로 명시 설정으로 고정)
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/order_db}
    username: ${DB_USERNAME:eoghks}
    password: ${DB_PASSWORD:eoghks_local}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_ORDER_HOST:localhost}
      port: ${REDIS_ORDER_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

kafka:
  topic:
    order-created: order.created
    order-item-cancelled: order.item.cancelled
    stock-decreased: stock.decreased
    stock-decrease-failed: stock.decrease.failed

app:
  order:
    # payment-foundation §3.2: 배송완료 후 자동 구매확정까지의 대기 일수(정책값).
    # 정책 테이블(mileage_policy) 이관은 마일리지 단계(V1.1-9)에서 진행한다.
    auto-confirm-days: ${ORDER_AUTO_CONFIRM_DAYS:7}
    # 자동확정 1회 실행당 처리 상한 — 대량 적체 시 트랜잭션이 길어지지 않게 제한
    auto-confirm-batch-size: ${ORDER_AUTO_CONFIRM_BATCH_SIZE:500}
  internal:
    # M-N1: 서비스 간 내부 호출 공유 시크릿. dev 기본값, prod는 INTERNAL_TOKEN env 필수.
    token: ${INTERNAL_TOKEN:dev-internal-secret}

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never    # 보안(H-A): 헬스 상세 비노출. status(UP/DOWN)만 공개 — 모니터링은 status만 사용

logging:
  file:
    name: ${user.dir}/logs/order-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
  level:
    com.ecommerce: INFO
